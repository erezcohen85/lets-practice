[project]
name = "lets-practice-processor"
version = "0.1.0"
description = "Let's Practice processor: conversion, OMR, downbeat detection and alignment (FastAPI, Railway)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26.4",
    "pillow>=13.0.0",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=1.28.2,<2",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Real downbeat detection (Phase 8). Pulls in torch, so tests and the fake-backed server do not need it.
# soundfile: on Linux torchaudio 2.11's load needs torchcodec, so Beat This reads the WAV with soundfile instead.
beat = ["beat-this>=1.1", "tqdm", "soundfile"]

[dependency-groups]
dev = [
    "pglast>=8.7",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: takes more than about 2 s; still part of the default run",
    "real: runs a real tool (Java, torch, the network); skipped unless -m real is given",
]
filterwarnings = ["ignore:builtin type (SwigPy|swigvar).*:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# torch publishes no macOS x86_64 wheels after 2.2.2, and 2.2.2 needs numpy 1.x.
# Elsewhere torch stays on torchaudio's newest wheel: torchaudio's compiled library only loads with the
# torch minor it was built for, and its last wheels are 2.11.0 (a newer torch fails at import).
constraint-dependencies = [
    "torch==2.11.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio==2.11.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch<=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio<=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
